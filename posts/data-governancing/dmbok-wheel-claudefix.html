<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAMA-DMBOK Wheel — Interactive Image Map &copy; 2024 DAMA International</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #35eaff;
      --blue: #1688ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      text-align: center;
      padding: clamp(16px, 3vw, 36px);
      color: #eaf7ff;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(ellipse at 50% 35%, #092c67 0%, #04132f 50%, #020713 100%);
    }

    main {
      max-width: 860px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      letter-spacing: .02em;
    }

    .intro {
      margin: 0 0 22px;
      color: #a9d7ff;
    }

    /* Positioning context for the wheel and its popup (popup must not be clipped by the wheel) */
    .stage {
      position: relative;
      width: 100%;
    }

    .wheel {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 28px #087dff55;
    }

    .wheel img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .wheel svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hotspot {
      fill: #00d9ff;
      fill-opacity: 0;
      stroke: transparent;
      stroke-width: 3;
      stroke-linejoin: round;
      cursor: pointer;
      pointer-events: all;
      transition: fill-opacity .16s ease, stroke .16s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot:hover,
    .hotspot:focus,
    .hotspot.active {
      fill-opacity: .18;
      stroke: #74f7ff;
      filter: drop-shadow(0 0 8px #00cfff);
    }

    /* Popup */
    .tip {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 5;
      width: max-content;
      max-width: min(280px, 80%);
      padding: 14px 16px;
      border: 1px solid #1a8bffaa;
      border-radius: 14px;
      background: #061632ef;
      box-shadow: 0 0 22px #087dff55, inset 0 0 18px #087dff18;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity .14s ease, visibility .14s;
    }

    .tip.show {
      opacity: 1;
      visibility: visible;
    }

    .tip h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      line-height: 1.25;
      color: #fff;
    }

    .tip p {
      margin: 0;
      font-size: .9rem;
      color: #c4dff7;
    }

    footer {
      color: #7fa8ce;
      font-size: .8rem;
      margin-top: 20px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>DAMA-DMBOK Data Management Wheel</h1>
    <p class="intro">Hover over, tap, or keyboard-focus a segment to see what it covers.</p>

    <div class="stage" id="stage">
      <div class="wheel">
        <img src="images/dmbok-wheel.webp"
          alt="Blue neon DAMA-DMBOK wheel with Data Governance in the center and labeled data management domains">
        <svg viewBox="0 0 1254 1254" aria-label="Interactive segment hotspots" role="group">
          <circle class="hotspot" cx="622" cy="614" r="234" tabindex="0" role="button" aria-label="Data Governance"
            data-name="Data Governance" data-x="622" data-y="614"
            data-description="The central discipline that establishes accountability, policies, standards, and decision rights across all data management areas." />
          <path class="hotspot" tabindex="0" role="button" aria-label="Data Architecture" data-name="Data Architecture"
            data-x="624" data-y="214"
            data-description="The enterprise data structures, flows, and architectural blueprints."
            d="M 465.7,99.1 A 540,540 0 0 1 790.7,103.0 L 697.8,365.3 A 260,260 0 0 0 544.1,365.9 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Data Modeling &amp; Design"
            data-name="Data Modeling &amp; Design" data-x="862" data-y="294"
            data-description="Conceptual, logical, and physical models that describe data."
            d="M 800.2,106.2 A 540,540 0 0 1 1064.9,307.0 L 832.2,461.0 A 260,260 0 0 0 707.3,368.4 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Data Storage &amp; Operations"
            data-name="Data Storage &amp; Operations" data-x="1004" data-y="494"
            data-description="Platforms, databases, integration, and operational data management."
            d="M 1070.5,315.3 A 540,540 0 0 1 1161.7,598.3 L 882.0,612.3 A 260,260 0 0 0 838.0,469.2 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Data Security" data-name="Data Security"
            data-x="1005" data-y="730"
            data-description="Protecting data through access control, privacy, and risk management."
            d="M 1161.9,608.3 A 540,540 0 0 1 1067.4,921.4 L 842.1,752.4 A 260,260 0 0 0 881.9,622.3 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Reference &amp; Master Data"
            data-name="Reference &amp; Master Data" data-x="876" data-y="923"
            data-description="Consistent, trusted definitions for key entities and reference values."
            d="M 1061.6,929.6 A 540,540 0 0 1 836.1,1111.7 L 727.1,851.8 A 260,260 0 0 0 836.6,760.8 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Data Warehousing &amp; Business Intelligence"
            data-name="Data Warehousing &amp; Business Intelligence" data-x="628" data-y="1014"
            data-description="Analytical data stores, reporting, and decision-support capabilities."
            d="M 826.9,1115.6 A 540,540 0 0 1 414.6,1114.6 L 540.9,861.0 A 260,260 0 0 0 717.9,855.7 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Data Quality" data-name="Data Quality"
            data-x="377" data-y="930" data-description="Defining, measuring, monitoring, and improving fitness for use."
            d="M 405.4,1110.6 A 540,540 0 0 1 184.0,931.9 L 415.2,771.5 A 260,260 0 0 0 531.4,857.7 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Document &amp; Content Management"
            data-name="Document &amp; Content Management" data-x="241" data-y="736"
            data-description="Managing documents, records, and unstructured information."
            d="M 178.3,923.7 A 540,540 0 0 1 82.0,610.9 L 362.1,621.9 A 260,260 0 0 0 409.3,763.5 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Metadata Management"
            data-name="Metadata Management" data-x="240" data-y="494"
            data-description="Managing data definitions, lineage, context, and technical metadata."
            d="M 82.2,600.9 A 540,540 0 0 1 181.3,303.9 L 402.3,475.0 A 260,260 0 0 0 362.0,611.9 Z" />
          <path class="hotspot" tabindex="0" role="button" aria-label="Data Lifecycle Management"
            data-name="Data Lifecycle Management" data-x="383" data-y="293"
            data-description="Managing data from creation and use through retention and disposal."
            d="M 187.2,295.8 A 540,540 0 0 1 456.1,102.1 L 534.6,369.1 A 260,260 0 0 0 407.8,466.6 Z" />
        </svg>
      </div>

      <div class="tip" id="tip" role="tooltip" aria-live="polite">
        <h2 id="tip-title"></h2>
        <p id="tip-desc"></p>
      </div>
    </div>

    <footer>Copyright &copy; 2024 DAMA International
    </footer>
  </main>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const svg = stage.querySelector('svg');
      const tip = document.getElementById('tip');
      const tipTitle = document.getElementById('tip-title');
      const tipDesc = document.getElementById('tip-desc');
      const hotspots = [...svg.querySelectorAll('.hotspot')];
      const VB = 1254;               // SVG viewBox size
      let current = null;
      let hovering = false;          // mouse is over a hotspot

      function fill(el) {
        tipTitle.textContent = el.dataset.name;
        tipDesc.textContent = el.dataset.description;
        hotspots.forEach(h => h.classList.toggle('active', h === el));
        current = el;
        tip.classList.add('show');
      }

      function hide() {
        current = null;
        hovering = false;
        hotspots.forEach(h => h.classList.remove('active'));
        tip.classList.remove('show');
      }

      // Keep the popup inside the stage
      function place(x, y, below) {
        const sw = stage.clientWidth, sh = stage.clientHeight;
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        let left = x - tw / 2;
        let top = below ? y + 18 : y - th - 18;
        left = Math.max(4, Math.min(sw - tw - 4, left));
        top = Math.max(4, Math.min(sh - th - 4, top));
        tip.style.transform = `translate(${left}px, ${top}px)`;
      }

      // Anchor the popup to a segment (used for touch and keyboard focus)
      function anchor(el) {
        const r = svg.getBoundingClientRect(), s = stage.getBoundingClientRect();
        const k = r.width / VB;
        const x = r.left - s.left + parseFloat(el.dataset.x) * k;
        const y = r.top - s.top + parseFloat(el.dataset.y) * k;
        place(x, y, y < stage.clientHeight / 2);
      }

      // Follow the mouse pointer
      function follow(e) {
        const s = stage.getBoundingClientRect();
        const x = e.clientX - s.left, y = e.clientY - s.top;
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        let left = x + 16, top = y + 20;
        if (left + tw > stage.clientWidth - 4) left = x - tw - 16;
        if (top + th > stage.clientHeight - 4) top = y - th - 16;
        left = Math.max(4, left); top = Math.max(4, top);
        tip.style.transform = `translate(${left}px, ${top}px)`;
      }

      hotspots.forEach(el => {
        el.addEventListener('pointerenter', e => {
          if (e.pointerType !== 'mouse') return;
          hovering = true;
          fill(el);
          follow(e);
        });
        el.addEventListener('pointermove', e => {
          if (e.pointerType === 'mouse' && current === el) follow(e);
        });
        el.addEventListener('pointerleave', e => {
          if (e.pointerType === 'mouse') hide();
        });
        // Touch / pen: tap a segment to open its popup
        el.addEventListener('pointerdown', e => {
          if (e.pointerType === 'mouse') return;
          fill(el);
          anchor(el);
        });
        // Keyboard focus (Tab) and Enter/Space
        el.addEventListener('focus', () => {
          if (hovering) return;
          fill(el);
          anchor(el);
        });
        el.addEventListener('blur', () => { if (!hovering) hide(); });
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fill(el); anchor(el); }
          if (e.key === 'Escape') { hide(); el.blur(); }
        });
      });

      // Tap anywhere outside the wheel hotspots to dismiss
      document.addEventListener('pointerdown', e => {
        if (!e.target.closest || !e.target.closest('.hotspot')) hide();
      });
      window.addEventListener('resize', () => { if (current && !hovering) anchor(current); });
    })();
  </script>
</body>

</html>
